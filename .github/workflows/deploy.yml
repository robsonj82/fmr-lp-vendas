name: 🚀 Deploy para Napoleon via FTP

on:
  workflow_dispatch:  # Permite rodar manualmente se quiser
  push:
    branches:
      - 'claude/nails-course-landing-page-011CV4KzgzRmMZwmb2HwuMnf'  # 👈 Aspas simples obrigatórias!

jobs:
  ftp-deploy:
    name: 📤 Enviando arquivos via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout do código
        uses: actions/checkout@v3

      - name: 📂 Deploy com FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          protocol: ftp

