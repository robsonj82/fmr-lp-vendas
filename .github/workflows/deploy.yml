name: 🚀 Deploy Gadu Host para Servidor FTP

on:
  push:
    branches:
      - main
      - claude/nails-course-landing-page-011CV4KzgzRmMZwmb2HwuMnf
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: 🚀 Deploy via FTP para public_html
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/specialists/**
            **/.github/**
            **/README.md
            **/.gitignore
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
