name: 🚀 Deploy para Napoleon via FTP

on:
  workflow_dispatch:  # Permite rodar manualmente se quiser
  push:
    branches:
      - 'claude/nails-course-landing-page-011CV4KzgzRmMZwmb2HwuMnf'  # 👈 Aspas simples obrigatórias!

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Clonar o repositório
        uses: actions/checkout@v3

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
       port: 21
          protocol: ftp  # ou ftps se seu servidor exigir TLS
          server-dir: /public_html/
          local-dir: ./  # ou dist/, dependendo do projeto
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
